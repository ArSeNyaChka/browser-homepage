<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/terminal.css" id="terminal-theme" disabled>
    <title>Meow</title>
</head>
<body>
    <main class="page-layout">
        <nav class="sidebar sidebar--left" aria-label="Левая панель">
            <a href="https://github.com" class="icon-btn" aria-label="GitHub">
                <img src="icons/github_icon.png" alt="" class="icon-btn__img">
            </a>
            <a href="https://vk.ru" class="icon-btn" aria-label="VK">
                <img src="icons/vk_icon.png" alt="" class="icon-btn__img">
            </a>
            <a href="https://discord.com/app" class="icon-btn" aria-label="Discord">
                <img src="icons/discord_icon.png" alt="" class="icon-btn__img">
            </a>
            <a href="https://ru.pinterest.com" class="icon-btn" aria-label="Pinterest">
                <img src="icons/discord_icon.png" alt="" class="icon-btn__img">
            </a>
        </nav>

        <section class="center-panel">
            <div class="search-container">
                <div class="engine-selector" role="radiogroup" aria-label="Поисковая система">
                    <button class="engine-btn" role="radio" aria-checked="false" data-engine="google">Google</button>
                    <button class="engine-btn" role="radio" aria-checked="false" data-engine="duckduckgo">DuckDuckGo</button>
                    <button class="engine-btn" role="radio" aria-checked="false" data-engine="youtube">YouTube</button>
                </div>
                <div class="search-input-wrapper">
                    <input
                        type="text"
                        id="search-line-input"
                        class="search-input"
                        autocomplete="off"
                        spellcheck="false"
                        autofocus
                        placeholder="Поиск или адрес сайта…"
                        aria-label="Поисковая строка"
                        aria-controls="suggestions-list"
                        aria-autocomplete="list"
                    >
                    <button id="clear-btn" class="clear-btn" aria-label="Очистить" hidden>✕</button>
                </div>
                <ul id="suggestions-list" class="suggestions-list" role="listbox" hidden></ul>
            </div>
        </section>

        <nav class="sidebar sidebar--right" aria-label="Правая панель">
            <a href="https://google.com" class="icon-btn" aria-label="Google">
                <img src="icons/google_icon.png" alt="" class="icon-btn__img">
            </a>
            <a href="https://youtube.com" class="icon-btn" aria-label="YouTube">
                <img src="icons/youtube_icon.png" alt="" class="icon-btn__img">
            </a>
            <a href="https://music.youtube.com" class="icon-btn" aria-label="YouTube Music">
                <img src="icons/ytm_icon.png" alt="" class="icon-btn__img">
            </a>
            <a href="https://chat.deepseek.com" class="icon-btn" aria-label="DeepSeek">
                <img src="icons/ai_icon.png" alt="" class="icon-btn__img">
            </a>
        </nav>
    </main>

    <button id="aliases-open-btn" class="aliases-open-btn" aria-haspopup="dialog" title="Управление алиасами">⚙</button>

    <dialog id="aliases-dialog" class="aliases-dialog" aria-labelledby="aliases-title">
        <div class="aliases-dialog__head">
            <h2 id="aliases-title" class="aliases-dialog__title">Алиасы сайтов</h2>
            <button id="aliases-close-btn" class="aliases-dialog__close" aria-label="Закрыть">✕</button>
        </div>

        <form id="alias-form" class="alias-form">
            <input id="alias-name" class="alias-form__input" placeholder="Название, например Notion" autocomplete="off" required>
            <input id="alias-url" class="alias-form__input" placeholder="Адрес, например notion.so" autocomplete="off" required>
            <input id="alias-values" class="alias-form__input alias-form__input--wide" placeholder="Алиасы через пробел: n, notion" autocomplete="off" required>
            <button type="submit" class="alias-form__submit">Добавить</button>
        </form>

        <ul id="aliases-list" class="aliases-list"></ul>

        <div class="aliases-dialog__footer">
            <label class="aliases-file-btn">Импорт
                <input id="aliases-import-file" type="file" accept="application/json,.json" hidden>
            </label>
            <button id="aliases-export-btn" class="aliases-file-btn">Экспорт</button>
            <button id="aliases-reset-btn" class="aliases-file-btn aliases-file-btn--danger">Сбросить</button>
            <p id="aliases-status" class="aliases-status" role="status" aria-live="polite"></p>
        </div>
    </dialog>

    <script src="js/utils.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/sites.js"></script>
    <script src="js/searchline.js"></script>
    <script src="js/aliases-panel.js"></script>
    <script src="js/ui.js"></script>
</body>
</html>
