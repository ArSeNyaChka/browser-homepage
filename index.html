<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/terminal.css" id="terminal-theme" disabled>
    <title>Meow</title>
</head>
<body>
    <main class="page-layout">
        <nav class="sidebar sidebar--left" aria-label="Левая панель">
            <a href="https://github.com" class="icon-btn" aria-label="GitHub">
                <img src="icons/github_icon.png" alt="" class="icon-btn__img">
            </a>
            <a href="https://vk.ru" class="icon-btn" aria-label="VK">
                <img src="icons/vk_icon.png" alt="" class="icon-btn__img">
            </a>
            <a href="https://discord.com/app" class="icon-btn" aria-label="Discord">
                <img src="icons/discord_icon.png" alt="" class="icon-btn__img">
            </a>
            <a href="https://ru.pinterest.com" class="icon-btn" aria-label="Pinterest">
                <img src="icons/discord_icon.png" alt="" class="icon-btn__img">
            </a>
        </nav>

        <section class="center-panel">
            <div class="search-container">
                <div class="engine-selector" role="radiogroup" aria-label="Поисковая система">
                    <button class="engine-btn" role="radio" aria-checked="false" data-engine="google">Google</button>
                    <button class="engine-btn" role="radio" aria-checked="false" data-engine="duckduckgo">DuckDuckGo</button>
                    <button class="engine-btn" role="radio" aria-checked="false" data-engine="youtube">YouTube</button>
                </div>
                <div class="search-input-wrapper">
                    <input
                        type="text"
                        id="search-line-input"
                        class="search-input"
                        autocomplete="off"
                        spellcheck="false"
                        autofocus
                        placeholder="Поиск или адрес сайта…"
                        aria-label="Поисковая строка"
                        aria-controls="suggestions-list"
                        aria-autocomplete="list"
                    >
                    <button id="clear-btn" class="clear-btn" aria-label="Очистить" hidden>✕</button>
                </div>
                <ul id="suggestions-list" class="suggestions-list" role="listbox" hidden></ul>
            </div>
        </section>

        <nav class="sidebar sidebar--right" aria-label="Правая панель">
            <a href="https://google.com" class="icon-btn" aria-label="Google">
                <img src="icons/google_icon.png" alt="" class="icon-btn__img">
            </a>
            <a href="https://youtube.com" class="icon-btn" aria-label="YouTube">
                <img src="icons/youtube_icon.png" alt="" class="icon-btn__img">
            </a>
            <a href="https://music.youtube.com" class="icon-btn" aria-label="YouTube Music">
                <img src="icons/ytm_icon.png" alt="" class="icon-btn__img">
            </a>
            <a href="https://chat.deepseek.com" class="icon-btn" aria-label="DeepSeek">
                <img src="icons/ai_icon.png" alt="" class="icon-btn__img">
            </a>
        </nav>
    </main>

    <script src="js/searchline.js"></script>
    <script src="js/ui.js"></script>
</body>
</html>
